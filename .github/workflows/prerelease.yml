
name: Build and Pre-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. v0.1.0-rc.1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Dockvim
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Build Linux AMD64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags="-s -w" \
            -o dist/dockvim \
            ./cmd/dockvim
          chmod +x dist/dockvim

      - name: Build Linux ARM64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
        run: |
          go build -trimpath \
            -ldflags="-s -w" \
            -o dist/dockvim-linux-arm64 \
            ./cmd/dockvim
          chmod +x dist/dockvim-linux-arm64

      - name: Generate checksums
        run: |
          cd dist
          sha256sum dockvim dockvim-linux-arm64 > checksums.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dockvim-${{ inputs.version }}
          path: dist/
          retention-days: 7

  release:
    name: Publish Pre-release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dockvim-${{ inputs.version }}
          path: dist/

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION"
            echo "Expected format: v0.1.0-rc.1"
            exit 1
          fi

          if gh release view "$VERSION" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release already exists for $VERSION"
            exit 1
          fi

          if git ls-remote --exit-code --tags origin \
            "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Git tag already exists: $VERSION"
            exit 1
          fi

      - name: Verify executable permissions
        run: |
          chmod +x dist/dockvim
          chmod +x dist/dockvim-linux-arm64

      - name: Publish GitHub Pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "$VERSION" \
            dist/dockvim \
            dist/dockvim-linux-arm64 \
            dist/checksums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Dockvim $VERSION" \
            --generate-notes \
            --prerelease \
            --latest=false
